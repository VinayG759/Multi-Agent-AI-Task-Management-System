<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 890" width="1500" height="890" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>TaskPilot: final architecture, as built</title>
  <desc>Telegram and the dashboard reach one FastAPI process. Inside it, an Agent Runtime runs an Orchestrator that hands work to a Task Agent, which writes only after a Reviewer approves, or to a read-only Advisor Agent. Agents reach the SQLite database only through services. All four agents call the Anthropic API.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b3b47"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-size: 22px; font-weight: 700; fill: #17171c; }
      .sub { font-size: 13px; fill: #55555f; }
      .box { fill: #ffffff; stroke: #b9b9c2; stroke-width: 1.2; }
      .person { fill: #f6f6f7; stroke: #b9b9c2; stroke-width: 1.2; }
      .agent { fill: #eeeefc; stroke: #4338ca; stroke-width: 1.4; }
      .gate { fill: #fdf1df; stroke: #8a3c05; stroke-width: 1.4; }
      .svc { fill: #ffffff; stroke: #b9b9c2; stroke-width: 1.2; }
      .db { fill: #e3f6ec; stroke: #05603a; stroke-width: 1.4; }
      .ext { fill: #ffffff; stroke: #55555f; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .process { fill: #fafafb; stroke: #55555f; stroke-width: 1.4; stroke-dasharray: 8 5; }
      .group { fill: #f3f3f6; stroke: #dedee3; stroke-width: 1; }
      .h { font-size: 14px; font-weight: 700; fill: #17171c; }
      .t { font-size: 11.5px; fill: #3b3b47; }
      .tag { font-size: 10.5px; font-weight: 600; fill: #55555f; letter-spacing: 0.04em; }
      .glabel { font-size: 12px; font-weight: 700; fill: #3b3b47; }
      .elabel { font-size: 11px; fill: #3b3b47; font-weight: 600; }
      .line { fill: none; stroke: #3b3b47; stroke-width: 1.5; }
      .legend { font-size: 12px; fill: #17171c; }
      .legend-h { font-size: 12px; font-weight: 700; fill: #17171c; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="890"/>

  <text class="title" x="30" y="36">TaskPilot: final architecture, as built</text>
  <text class="sub" x="30" y="58">One Python process. Four agents. Agents never touch the database directly; every change passes the Reviewer.</text>

  <!-- External LLM provider -->
  <rect class="ext" x="600" y="78" width="240" height="56" rx="8"/>
  <text class="tag" x="614" y="96">EXTERNAL SERVICE</text>
  <text class="h" x="614" y="114">Anthropic API (Claude)</text>
  <text class="t" x="614" y="128">Model per agent role is set in .env</text>

  <!-- Process boundary -->
  <rect class="process" x="240" y="160" width="930" height="610" rx="12"/>
  <text class="glabel" x="256" y="182">SINGLE FASTAPI PROCESS (Python 3.11)</text>

  <!-- People -->
  <rect class="person" x="30" y="420" width="170" height="70" rx="8"/>
  <text class="tag" x="44" y="440">PERSON</text>
  <text class="h" x="44" y="459">Telegram user</text>
  <text class="t" x="44" y="476">Chats with the bot</text>

  <rect class="person" x="30" y="640" width="170" height="70" rx="8"/>
  <text class="tag" x="44" y="660">PERSON</text>
  <text class="h" x="44" y="679">Dashboard user</text>
  <text class="t" x="44" y="696">Browser</text>

  <!-- Channels and entry points -->
  <rect class="box" x="270" y="210" width="200" height="90" rx="8"/>
  <text class="tag" x="284" y="230">BACKGROUND JOBS</text>
  <text class="h" x="284" y="249">Scheduler</text>
  <text class="t" x="284" y="266">APScheduler. Daily plan, due-soon,</text>
  <text class="t" x="284" y="281">overdue follow-up, weekly summary</text>

  <rect class="box" x="270" y="410" width="200" height="90" rx="8"/>
  <text class="tag" x="284" y="430">CHANNEL</text>
  <text class="h" x="284" y="449">Telegram Adapter</text>
  <text class="t" x="284" y="466">python-telegram-bot, polling.</text>
  <text class="t" x="284" y="481">Join code keeps strangers out</text>

  <rect class="box" x="270" y="630" width="200" height="90" rx="8"/>
  <text class="tag" x="284" y="650">WEB</text>
  <text class="h" x="284" y="669">FastAPI Application</text>
  <text class="t" x="284" y="686">REST API, and the dashboard as</text>
  <text class="t" x="284" y="701">static HTML, CSS, JS (no build)</text>

  <!-- Agent layer -->
  <rect class="group" x="510" y="200" width="400" height="500" rx="10"/>
  <text class="glabel" x="526" y="222">AGENT LAYER (own tool-use loop, no framework)</text>

  <rect class="box" x="530" y="235" width="360" height="70" rx="8"/>
  <text class="h" x="544" y="258">Agent Runtime</text>
  <text class="t" x="544" y="276">One database transaction and one trace per request.</text>
  <text class="t" x="544" y="291">In-memory lock per user keeps messages in order.</text>

  <rect class="agent" x="530" y="335" width="360" height="60" rx="8"/>
  <text class="h" x="544" y="358">Orchestrator Agent</text>
  <text class="t" x="544" y="377">Decides which specialist, in what order. Writes the reply.</text>

  <rect class="agent" x="530" y="430" width="170" height="100" rx="8"/>
  <text class="h" x="544" y="453">Task Agent</text>
  <text class="t" x="544" y="472">The only agent that</text>
  <text class="t" x="544" y="487">writes. Search, create,</text>
  <text class="t" x="544" y="502">update, complete.</text>

  <rect class="agent" x="720" y="430" width="170" height="100" rx="8"/>
  <text class="h" x="734" y="453">Advisor Agent</text>
  <text class="t" x="734" y="472">Read-only. Lists, ranking,</text>
  <text class="t" x="734" y="487">task details, plans,</text>
  <text class="t" x="734" y="502">summaries.</text>

  <rect class="gate" x="530" y="580" width="170" height="100" rx="8"/>
  <text class="h" x="544" y="603">Reviewer Agent</text>
  <text class="t" x="544" y="622">Gate on every write:</text>
  <text class="t" x="544" y="637">approve, clarify or reject.</text>
  <text class="t" x="544" y="652">No tools, no database</text>
  <text class="t" x="544" y="667">access. Fails closed.</text>

  <!-- Services -->
  <rect class="group" x="940" y="200" width="210" height="500" rx="10"/>
  <text class="glabel" x="952" y="222">SERVICES (modules)</text>

  <rect class="svc" x="955" y="240" width="180" height="72" rx="8"/>
  <text class="h" x="969" y="262">Task Service</text>
  <text class="t" x="969" y="280">All task rules, history,</text>
  <text class="t" x="969" y="295">duplicate detection</text>

  <rect class="svc" x="955" y="327" width="180" height="72" rx="8"/>
  <text class="h" x="969" y="349">User Service</text>
  <text class="t" x="969" y="367">Team members, linking</text>
  <text class="t" x="969" y="382">a chat account to one</text>

  <rect class="svc" x="955" y="414" width="180" height="72" rx="8"/>
  <text class="h" x="969" y="436">Priority Scoring</text>
  <text class="t" x="969" y="454">Plain Python arithmetic.</text>
  <text class="t" x="969" y="469">Score plus its reasons</text>

  <rect class="svc" x="955" y="501" width="180" height="72" rx="8"/>
  <text class="h" x="969" y="523">Conversation Memory</text>
  <text class="t" x="969" y="541">Last messages per user,</text>
  <text class="t" x="969" y="556">incl. reminders sent</text>

  <rect class="svc" x="955" y="588" width="180" height="72" rx="8"/>
  <text class="h" x="969" y="610">Agent Trace</text>
  <text class="t" x="969" y="628">Every agent step, saved</text>
  <text class="t" x="969" y="643">even when a run fails</text>

  <!-- Database -->
  <rect class="db" x="1210" y="300" width="260" height="300" rx="10"/>
  <text class="tag" x="1226" y="322">DATABASE</text>
  <text class="h" x="1226" y="342">SQLite via SQLAlchemy (async)</text>
  <text class="t" x="1226" y="360">Postgres through DATABASE_URL at scale</text>
  <text class="t" x="1226" y="392">users</text>
  <text class="t" x="1226" y="412">tasks</text>
  <text class="t" x="1226" y="432">task_events: history of every change</text>
  <text class="t" x="1226" y="452">messages: conversation memory</text>
  <text class="t" x="1226" y="472">agent_runs, agent_steps: agent trace</text>
  <text class="t" x="1226" y="492">notifications: one row per reminder</text>
  <text class="t" x="1226" y="507">sent, so none is sent twice</text>
  <text class="t" x="1226" y="548">Only the services read or write here.</text>
  <text class="t" x="1226" y="565">All times stored in UTC.</text>

  <!-- Connections -->
  <!-- people to entry points -->
  <path class="line" d="M200 455 L270 455" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M200 675 L270 675" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- scheduler to runtime -->
  <path class="line" d="M470 250 L530 250" marker-end="url(#arrow)"/>
  <text class="elabel" x="476" y="242">events</text>

  <!-- scheduler to telegram adapter: outgoing reminders -->
  <path class="line" d="M370 300 L370 410" marker-end="url(#arrow)"/>
  <text class="elabel" x="378" y="352">plans and</text>
  <text class="elabel" x="378" y="366">reminders out</text>

  <!-- telegram adapter to runtime -->
  <path class="line" d="M470 440 L490 440 L490 272 L530 272" marker-end="url(#arrow)"/>

  <!-- fastapi to runtime (assistant box) -->
  <path class="line" d="M470 655 L500 655 L500 292 L530 292" marker-end="url(#arrow)"/>
  <text class="elabel" x="388" y="622">POST /api/chat</text>

  <!-- fastapi to services directly (manual edits) -->
  <path class="line" d="M470 700 L485 700 L485 735 L1045 735 L1045 700" marker-end="url(#arrow)"/>
  <text class="elabel" x="560" y="752">REST: view, edit and complete tasks by hand. No agents involved.</text>

  <!-- runtime to orchestrator -->
  <path class="line" d="M710 305 L710 335" marker-end="url(#arrow)"/>

  <!-- orchestrator to specialists -->
  <path class="line" d="M615 395 L615 430" marker-end="url(#arrow)"/>
  <text class="elabel" x="623" y="417">changes</text>
  <path class="line" d="M805 395 L805 430" marker-end="url(#arrow)"/>
  <text class="elabel" x="813" y="417">questions</text>

  <!-- task agent and reviewer -->
  <path class="line" d="M615 530 L615 580" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="elabel" x="623" y="552">proposal down,</text>
  <text class="elabel" x="623" y="566">verdict up</text>

  <!-- task agent to services: write -->
  <path class="line" d="M700 515 L712 515 L712 548 L940 548" marker-end="url(#arrow)"/>
  <text class="elabel" x="745" y="564">write, only after approval</text>

  <!-- advisor to services: read -->
  <path class="line" d="M890 470 L940 470" marker-end="url(#arrow)"/>
  <text class="elabel" x="899" y="462">read</text>

  <!-- runtime to services: memory and trace -->
  <path class="line" d="M890 270 L940 270" marker-end="url(#arrow)"/>

  <!-- services to database -->
  <path class="line" d="M1150 450 L1210 450" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="elabel" x="1168" y="438">SQL</text>

  <!-- agents to Anthropic -->
  <path class="line" d="M720 200 L720 134" marker-end="url(#arrow)"/>
  <text class="elabel" x="730" y="150">LLM calls from all four agents</text>

  <!-- Flows -->
  <text class="legend-h" x="30" y="806">Chat</text>
  <text class="legend" x="110" y="806">Telegram or dashboard → Agent Runtime → Orchestrator → Task Agent (each change through the Reviewer) or Advisor Agent → reply to the same place.</text>
  <text class="legend-h" x="30" y="830">Proactive</text>
  <text class="legend" x="110" y="830">Scheduler → Agent Runtime → Advisor Agent directly, without the Orchestrator → Telegram. A single due-soon reminder is a text template, with no LLM call.</text>
  <text class="legend-h" x="30" y="854">Manual</text>
  <text class="legend" x="110" y="854">Dashboard → REST API → Task Service. The same service the agents use, so the rules and the change history are identical whoever makes the change.</text>
</svg>
