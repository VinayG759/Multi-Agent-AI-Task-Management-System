<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · TaskPilot</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="signin-page">
  <main class="signin">
    <div class="brand">TaskPilot</div>
    <h1>Sign in</h1>
    <p class="hint">Enter the team password to open the dashboard.</p>

    <form class="form" method="post" action="/login">
      <div class="field">
        <label for="password">Password</label>
        <input id="password" class="input" name="password" type="password" autocomplete="current-password"
               required autofocus aria-describedby="signin-error">
        <!-- error -->
      </div>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>

    <p class="hint">To use TaskPilot in Telegram, message the bot and send your team's join code after /start.</p>
  </main>
</body>
</html>
